<canvas id="game" width="720" height="1280" aria-label="CAT TRAIN mobile game"></canvas><div id="version">CAT TRAIN v0.1 • Proof of Fun</div>
<script>/* CAT TRAIN v0.1.0 | Standalone Canvas2D gameplay engine shared with GDevelop.
   No dependencies; exports createCatTrain(canvas). All input is normalized to 720x1280.
*/
function createCatTrain(canvas) {
  'use strict';
  const C = canvas.getContext('2d');
  if (!C) throw new Error('Canvas 2D context required');
  const W=720,H=1280,SLOTS=18,COLS=6,LANES=3;
  canvas.width=W;canvas.height=H;
  const LANES_Y=[366,566,766], CAR_Y=[246,446,646], CATS_X=[112,208,304,400,496,592];
  const TYPES={
    FIRE:{name:'ВОГОНЬ',short:'Вогонь',c:'#f5826c',light:'#ffd0a0',symbol:'F',desc:'Підпалює монстрів'},
    FROST:{name:'КРИГА',short:'Крига',c:'#78cce6',light:'#cbf6ff',symbol:'I',desc:'Гальмує монстрів'},
    SPARK:{name:'БЛИСК',short:'Блиск',c:'#efc46a',light:'#fff0a8',symbol:'S',desc:'Б’є кілька цілей'},
    MEDIC:{name:'ЛІКАР',short:'Лікар',c:'#90d4a4',light:'#e1ffe8',symbol:'H',desc:'Лікує потяг'}
  };
  const TYPE_NAMES=Object.keys(TYPES);
  let seed=20261104; const rnd=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296;};
  const rand=(a,b)=>a+rnd()*(b-a), clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
  const R={intro:{x:168,y:885,w:384,h:94},queue:[{x:35,y:958,w:205,h:170},{x:258,y:958,w:205,h:170},{x:481,y:958,w:205,h:170}],
    rush:{x:35,y:1150,w:205,h:78},reroll:{x:258,y:1150,w:205,h:78},pause:{x:481,y:1150,w:205,h:78},
    continue:{x:100,y:902,w:520,h:95},upgrades:[{x:40,y:625,w:640,h:88},{x:40,y:730,w:640,h:88},{x:40,y:835,w:640,h:88}]};
  const state={phase:'intro',wave:1,health:12,maxHealth:12,fish:14,score:0,combo:0,merges:0,kills:0,
    cats:[],queue:[],selected:0,enemies:[],shots:[],particles:[],floaters:[],seconds:0,spawns:0,spawnClock:0,
    spawned:0,need:8,rotation:0,cycle:0,rotationFreeze:0,interval:4.5,fireRate:1,selectGlow:0,
    upgrades:[],chosen:null,lastDown:null,notice:'',noticeT:0,spawningDone:false,interludeClock:0,
    waveTime:0,sceneTime:0,shake:0,streak:0,pausedFrom:'play',sfxOn:true};
  let audio=null;
  function beep(f=400,d=.08,t='sine',g=.018){
    if(!state.sfxOn || typeof window==='undefined')return;
    try {const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audio=audio||new AC();
      if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),vol=audio.createGain();
      o.type=t;o.frequency.setValueAtTime(f,audio.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(80,f*.65),audio.currentTime+d);
      vol.gain.setValueAtTime(g,audio.currentTime);vol.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);
      o.connect(vol);vol.connect(audio.destination);o.start();o.stop(audio.currentTime+d+.015);
    } catch(e){} }
  function reset(){
    seed=20261104;Object.assign(state,{phase:'intro',wave:1,health:12,maxHealth:12,fish:14,score:0,combo:0,merges:0,kills:0,
      selected:0,enemies:[],shots:[],particles:[],floaters:[],seconds:0,spawns:0,spawnClock:0,spawned:0,need:8,
      rotation:0,cycle:0,rotationFreeze:0,interval:4.5,fireRate:1,selectGlow:0,upgrades:[],chosen:null,
      notice:'',noticeT:0,spawningDone:false,interludeClock:0,waveTime:0,sceneTime:0,shake:0,streak:0});
    state.cats=Array(SLOTS).fill(null);
    [[0,'FIRE'],[1,'FIRE'],[4,'FROST'],[6,'SPARK'],[8,'SPARK'],[12,'MEDIC']].forEach(([i,type])=>state.cats[i]=cat(type));
    state.queue=['FIRE','FROST','SPARK'];
  }
  function cat(type,tier=1){return{type,tier,cd:rand(.15,.6),pulse:0,face:rand(-.12,.12)}}
  function notice(s){state.notice=s;state.noticeT=3;}
  function start(){reset();state.phase='play';notice('Збери 3 котів одного типу!');beep(570,.13,'triangle');}
  function position(i){const lane=Math.floor(i/COLS),k=i%COLS;return{x:CATS_X[lane===1?COLS-1-k:k],y:LANES_Y[lane],lane};}
  function catCount(){return state.cats.filter(Boolean).length}
  function rollCat(){const v=rnd();return v<.29?'FIRE':v<.56?'FROST':v<.81?'SPARK':'MEDIC';}
  function burst(x,y,color,n=11){for(let z=0;z<n;z++){const a=rand(0,Math.PI*2),v=rand(60,220);state.particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rand(.27,.75),size:rand(2,6),color});}}
  function floater(x,y,label,color='#fff5c3',scale=1){state.floaters.push({x,y,label,color,life:1.1,scale});}
  function closestVacancy(index){for(let step=0;step<SLOTS;step++){let j=(index+step)%SLOTS;if(!state.cats[j])return j;}return -1;}
  function insert(index){
    if(state.phase!=='play' || index<0 || index>=SLOTS || !Number.isInteger(index))return false;
    const free=closestVacancy(index),full=free===-1,cost=full?3:1;
    if(state.fish<cost){notice(full?'Усі місця зайняті: заміна коштує 3 рибки.':'Потрібна рибка! Перемагай ворогів.');beep(130,.1,'sawtooth');return false;}
    if(!full){for(let n=free;n!==index;n=(n-1+SLOTS)%SLOTS){state.cats[n]=state.cats[(n-1+SLOTS)%SLOTS];}}
    const type=state.queue[state.selected];state.cats[index]=cat(type);state.fish-=cost;
    state.queue.splice(state.selected,1);state.queue.push(rollCat());state.selected=clamp(state.selected,0,2);
    const p=position(index);burst(p.x,p.y,TYPES[type].light,7);beep(360,.07,'triangle');
    const m=mergeAll(); if(!m){notice(full?'Вагони повні: замінив кота за 3 рибки!':'Котик на борту! Шукай комбінацію x3.');}
    return true;
  }
  function mergeAll(){
    let total=0;
    for(let pass=0;pass<12;pass++){
      let run=null;
      for(let i=0;i<SLOTS;i++){
        let a=state.cats[i],b=state.cats[(i+1)%SLOTS],c=state.cats[(i+2)%SLOTS];
        if(a&&b&&c&&a.type===b.type&&b.type===c.type&&a.tier===b.tier&&b.tier===c.tier){run=[i,(i+1)%SLOTS,(i+2)%SLOTS];break;}
      }
      if(!run)break;
      const mid=run[1],p=position(mid),type=state.cats[mid].type,tier=state.cats[mid].tier+1;
      state.cats[run[0]]=null;state.cats[run[2]]=null;
      state.cats[mid]=cat(type,tier);state.cats[mid].pulse=1;
      state.fish+=3;state.score+=90*tier;state.combo++;state.merges++;total++;
      state.rotationFreeze=2.3;state.shake=.25;
      burst(p.x,p.y,TYPES[type].light,26);floater(p.x,p.y-68,'МУТАЦІЯ! LV.'+tier,'#ffe899',1.25);beep(740,.18,'triangle',.024);
    }
    if(total)notice(total>1?'ЛАНЦЮГОВА МУТАЦІЯ ×'+total:'ТРИ КОТИ → ОДИН МУТАНТ! +3 🐟');
    return total;
  }
  function rotateCats(){
    if(state.phase!=='play')return false;
    state.cats.unshift(state.cats.pop());state.rotation=0;state.rotationFreeze=0;
    state.cycle++;state.shake=.12;beep(230,.06,'sine',.009);
    mergeAll();return true;
  }
  function rush(){if(state.phase!=='play'||state.fish<2){notice('Для руху конвеєра потрібно 2 рибки');return false;}state.fish-=2;rotateCats();return true;}
  function reroll(){if(state.phase!=='play'||state.fish<2){notice('Для заміни котів потрібно 2 рибки');return false;}state.fish-=2;state.queue=state.queue.map(rollCat);state.selected=0;beep(420,.12,'triangle');notice('Нові кандидати на борт!');return true;}
  function spawnEnemy(type,lane){
    if(lane===undefined)lane=Math.floor(rnd()*LANES);
    if(!type)type=state.wave===1?'RAT':(rnd()<.28?'SLIME':rnd()<.48?'BAT':'RAT');
    const hp=(type==='SLIME'?5.5:type==='BAT'?2.7:4)+(state.wave-1)*1.8;
    const enemy={id:state.spawned+state.enemies.length+Math.floor(rand(0,1e5)),type,lane,x:660,y:CAR_Y[lane]+48,
      hp,maxhp:hp,speed:(type==='BAT'?66:type==='SLIME'?40:55)+state.wave*4,
      slowed:0,burn:0,burnClock:0,anim:rand(0,6.28),alive:true};
    state.enemies.push(enemy);return enemy;
  }
  function damageEnemy(enemy,amount,kind){
    if(!enemy||!enemy.alive)return;
    enemy.hp-=amount;
    if(kind==='FIRE'){enemy.burn=Math.max(enemy.burn,2.8);}
    if(kind==='FROST')enemy.slowed=Math.max(enemy.slowed,2.7);
    burst(enemy.x,enemy.y,(TYPES[kind]||TYPES.FIRE).c,3);
    if(enemy.hp<=0){enemy.alive=false;state.kills++;state.score+=25;state.fish+=1;
      burst(enemy.x,enemy.y,'#ffd990',13);floater(enemy.x,enemy.y-18,'+1 🐟','#f4d18c',.9);beep(530,.07,'triangle',.01);}
  }
  function shoot(c,index,enemy){
    const p=position(index),power=c.tier===1?1:c.tier===2?2.4:c.tier===3?5:8;
    state.shots.push({x:p.x,y:p.y-19,tx:enemy.x,ty:enemy.y,enemy,life:.24,ttl:.24,color:TYPES[c.type].light,kind:c.type});
    damageEnemy(enemy,power,c.type);
    if(c.type==='SPARK'){
      const others=state.enemies.filter(e=>e.alive&&e!==enemy&&e.lane===enemy.lane&&Math.abs(e.x-enemy.x)<120).slice(0,c.tier);
      for(const e of others){damageEnemy(e,power*.52,'SPARK');state.shots.push({x:enemy.x,y:enemy.y,tx:e.x,ty:e.y,life:.15,ttl:.15,color:'#ffeca3'});}
    }
    if(c.type==='MEDIC'&&state.health<state.maxHealth&&rnd()<.28){state.health=Math.min(state.maxHealth,state.health+1);floater(p.x,p.y-50,'+1 ♥','#9eedb2',.9);}
    c.pulse=.45;
  }
  function nextWave(){
    state.wave++;state.phase='play';state.spawned=0;state.need=8+(state.wave-1)*4;
    state.waveTime=0;state.spawnClock=0;state.enemies=[];state.shots=[];
    state.spawningDone=false;state.interludeClock=0;state.rotation=0;state.rotationFreeze=0;
    notice('Хвиля '+state.wave+'! Захисти вагони!');beep(540,.16,'triangle');
  }
  const UPGRADES=[
    {id:'RATE',name:'ТУРБО-ВУСА',desc:'Коти атакують на 28% швидше',symbol:'⚡'},
    {id:'HEAL',name:'ЛАТАННЯ ВАГОНІВ',desc:'Відновити +5 здоров’я потяга',symbol:'♥'},
    {id:'FISH',name:'СТАНЦІЙНИЙ БУФЕТ',desc:'Отримати +10 рибок на нових котів',symbol:'🐟'}
  ];
  function upgrade(i){if(state.phase!=='station'||i<0||i>2)return false;const u=UPGRADES[i];
    if(u.id==='RATE')state.fireRate*=1.28;
    if(u.id==='HEAL')state.health=Math.min(state.maxHealth,state.health+5);
    if(u.id==='FISH')state.fish+=10;
    state.chosen=u.id;nextWave();return true;
  }
  function step(dt){
    dt=clamp(Number(dt)||0,0,.1);state.sceneTime+=dt;state.selectGlow+=dt;
    if(state.phase!=='play'){draw();return;}
    state.seconds+=dt;state.waveTime+=dt;state.noticeT=Math.max(0,state.noticeT-dt);
    state.shake=Math.max(0,state.shake-dt);
    state.rotationFreeze=Math.max(0,state.rotationFreeze-dt);
    state.rotation+=dt;
    if(state.rotation>=state.interval&&state.rotationFreeze<=0){state.rotation=0;rotateCats();}
    if(state.spawned<state.need){state.spawnClock+=dt;if(state.spawnClock>=(state.wave===1?1.7:state.wave===2?1.55:1.4)){
      state.spawnClock=0;spawnEnemy();state.spawned++;
    }}else state.spawningDone=true;
    for(const e of state.enemies){if(!e.alive)continue;
      e.anim+=dt*3;
      if(e.burn>0){e.burn-=dt;e.burnClock+=dt;if(e.burnClock>.6){e.burnClock=0;damageEnemy(e,.52,'DOT');}}
      e.slowed=Math.max(0,e.slowed-dt);
      e.x-=e.speed*(e.slowed>0?.48:1)*dt;
      if(e.x<=53){e.alive=false;const dmg=e.type==='SLIME'?3:2;state.health-=dmg;state.shake=.4;
        floater(110,e.y,'−'+dmg+' ♥','#ff7d7d',1.2);burst(83,e.y,'#ff9a7f',17);beep(125,.22,'sawtooth',.03);
        if(state.health<=0){state.health=0;state.phase='lose';notice('ПОТЯГ ЗАХОПИЛИ!');}}
    }
    state.enemies=state.enemies.filter(e=>e.alive);
    if(state.phase==='play'){
      for(let i=0;i<SLOTS;i++){
        const c=state.cats[i];if(!c)continue;
        c.cd-=dt;c.pulse=Math.max(0,c.pulse-dt);
        if(c.cd>0)continue;
        const p=position(i);
        const candidates=state.enemies.filter(e=>e.alive&&e.lane===p.lane&&e.x>=45&&e.x<=650&&Math.abs(e.x-p.x)<(c.type==='SPARK'?230:190));
        candidates.sort((a,b)=>a.x-b.x);
        if(candidates.length){shoot(c,i,candidates[0]);c.cd=Math.max(.19,(c.type==='SPARK'?1.55:c.type==='MEDIC'?2.3:1.18)/(state.fireRate*Math.pow(1.05,c.tier-1)));}
        else {c.cd=.18;if(c.type==='MEDIC'&&state.health<state.maxHealth&&rnd()<.003){state.health++;}}
      }
    }
    for(const p of state.particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=240*dt;p.life-=dt;}state.particles=state.particles.filter(p=>p.life>0);
    for(const f of state.floaters){f.y-=dt*34;f.life-=dt;}state.floaters=state.floaters.filter(f=>f.life>0);
    for(const s of state.shots){s.life-=dt;}state.shots=state.shots.filter(s=>s.life>0);
    if(state.phase==='play'&&state.spawned>=state.need&&state.enemies.length===0){state.interludeClock+=dt;
      if(state.interludeClock>1.3){if(state.wave>=3){state.phase='win';notice('УСІ ХВИЛІ ВІДБИТО!');beep(820,.33,'triangle');}
        else{state.phase='station';state.chosen=null;notice('СТАНЦІЯ: обери покращення');beep(630,.27,'triangle');}}
    }
    draw();
  }
  function inRect(x,y,r){return x>=r.x&&y>=r.y&&x<=r.x+r.w&&y<=r.y+r.h;}
  function input(x,y){
    if(state.phase==='intro'){if(inRect(x,y,R.intro)||y>800){start();return true;}return false;}
    if(state.phase==='win'||state.phase==='lose'){if(y>835){start();return true;}return false;}
    if(state.phase==='station'){for(let i=0;i<3;i++)if(inRect(x,y,R.upgrades[i]))return upgrade(i);return false;}
    if(state.phase==='paused'){if(y>780){state.phase=state.pausedFrom||'play';return true;}return false;}
    for(let i=0;i<3;i++){if(inRect(x,y,R.queue[i])){state.selected=i;beep(470+i*105,.06,'triangle',.012);return true;}}
    if(inRect(x,y,R.rush))return rush();
    if(inRect(x,y,R.reroll))return reroll();
    if(inRect(x,y,R.pause)){state.pausedFrom=state.phase;state.phase='paused';return true;}
    if(y>=CAR_Y[0]+72&&y<=CAR_Y[2]+165){
      for(let lane=0;lane<LANES;lane++)if(Math.abs(y-LANES_Y[lane])<61){
        let col=clamp(Math.round((x-CATS_X[0])/(CATS_X[1]-CATS_X[0])),0,5);
        let idx=lane*6+(lane===1?5-col:col);
        return insert(idx);
      }
    }
    return false;
  }
  function keyDown(k){let key=String(k).toLowerCase();if(key==='enter'||key===' '){if(state.phase==='intro'||state.phase==='win'||state.phase==='lose'){start();return;}if(state.phase==='paused'){state.phase='play';return;}if(state.phase==='station'){upgrade(0);return;}}
    if(key==='escape'||key==='p'){if(state.phase==='play'){state.phase='paused';state.pausedFrom='play';}else if(state.phase==='paused')state.phase='play';}
    if(state.phase!=='play')return;
    if(['1','2','3'].includes(key))state.selected=+key-1;
    if(key==='r')reroll();if(key==='s')rush();
    if(['q','w','e'].includes(key)){const ix={q:0,w:1,e:2}[key];state.selected=ix;}
  }
  function getInfo(){return{phase:state.phase,wave:state.wave,health:state.health,maxHealth:state.maxHealth,fish:state.fish,
    kills:state.kills,score:state.score,merges:state.merges,cats:catCount(),spawned:state.spawned,need:state.need,
    rotation:state.rotation,queue:[...state.queue],selected:state.selected};}
  // ---- Rendering primitives (intentionally 100% procedural) ----
  function pathRound(x,y,w,h,r=12){r=Math.min(r,Math.min(w,h)/2);C.beginPath();C.moveTo(x+r,y);C.arcTo(x+w,y,x+w,y+h,r);C.arcTo(x+w,y+h,x,y+h,r);C.arcTo(x,y+h,x,y,r);C.arcTo(x,y,x+w,y,r);C.closePath();}
  function fillRound(x,y,w,h,c,r=12){C.fillStyle=c;pathRound(x,y,w,h,r);C.fill();}
  function strokeRound(x,y,w,h,c,r=12,th=2){C.strokeStyle=c;C.lineWidth=th;pathRound(x,y,w,h,r);C.stroke();}
  function text(s,x,y,size=24,color='#f7f1dd',weight='600',align='left'){C.font=`${weight} ${size}px system-ui,Arial,sans-serif`;C.textAlign=align;C.textBaseline='middle';C.fillStyle=color;C.fillText(String(s),x,y);}
  function circle(x,y,r,c){C.fillStyle=c;C.beginPath();C.arc(x,y,r,0,Math.PI*2);C.fill();}
  function ellipse(x,y,rx,ry,c){C.fillStyle=c;C.beginPath();C.ellipse(x,y,rx,ry,0,0,Math.PI*2);C.fill();}
  function line(x1,y1,x2,y2,c='#fff',w=2){C.beginPath();C.moveTo(x1,y1);C.lineTo(x2,y2);C.lineWidth=w;C.strokeStyle=c;C.stroke();}
  function polygon(points,c){C.fillStyle=c;C.beginPath();C.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)C.lineTo(points[i][0],points[i][1]);C.closePath();C.fill();}
  function gradient(x,y,w,h,c1,c2){const g=C.createLinearGradient(x,y,x+w,y+h);g.addColorStop(0,c1);g.addColorStop(1,c2);return g;}
  function panel(x,y,w,h,color='#152335',edge='#51617a',r=19){fillRound(x,y,w,h,'#0007',r);fillRound(x+1,y+1,w-2,h-2,color,r);strokeRound(x+1,y+1,w-2,h-2,edge,r,2);}
  function catFace(x,y,scale,type,tier=1,pulse=0){const d=TYPES[type]||TYPES.FIRE;C.save();C.translate(x,y);C.scale(scale*(1+pulse*.15),scale*(1+pulse*.15));
    circle(0,5,39,'#080e1a');circle(0,5,34,d.c);
    polygon([[-30,-15],[-28,-56],[-2,-35]],d.c);polygon([[30,-15],[28,-56],[2,-35]],d.c);
    polygon([[-24,-26],[-23,-45],[-11,-30]],'#f8bdd0');polygon([[24,-26],[23,-45],[11,-30]],'#f8bdd0');
    ellipse(-13,2,7,9,'#152535');ellipse(13,2,7,9,'#152535');circle(-11,-1,2,'#fcffeb');circle(15,-1,2,'#fcffeb');
    polygon([[-5,16],[5,16],[0,21]],'#513746');line(0,22,-4,25,'#513746',2);line(0,22,4,25,'#513746',2);
    line(-8,20,-30,16,'#fff5df',1.5);line(-9,24,-32,26,'#fff5df',1.5);line(8,20,30,16,'#fff5df',1.5);line(9,24,32,26,'#fff5df',1.5);
    if(type==='SPARK'){polygon([[-4,-38],[5,-38],[-1,-27],[10,-27],[-6,-9],[-2,-23],[-10,-23]],'#fff3ad');}
    if(type==='FROST'){polygon([[-3,-36],[3,-36],[3,-26],[13,-29],[17,-23],[8,-17],[13,-10],[4,-14],[-4,-10],[-8,-17],[-16,-23],[-12,-29],[-3,-26]],'#e7faff');}
    if(type==='MEDIC'){fillRound(-4,-33,8,22,'#f9fff7',2);fillRound(-11,-26,22,8,'#f9fff7',2);}
    if(type==='FIRE'){polygon([[-9,-38],[-2,-48],[0,-39],[11,-51],[8,-30],[2,-26]],'#fff0ab');}
    if(tier>1){strokeRound(-43,-50,86,93,'#fce3a9',20,4);fillRound(-21,29,42,23,'#fce5a0',9);text('★'+tier,0,41,15,'#4c332c','900','center');}
    C.restore();}
  function drawEnemy(e){const x=e.x,y=e.y+Math.sin(e.anim)*2;C.save();C.translate(x,y);
    ellipse(0,30,39,7,'#0008');
    if(e.type==='BAT'){
      polygon([[-22,0],[-40,-22],[-32,3],[-46,10],[-17,15]],'#987fae');polygon([[22,0],[40,-22],[32,3],[46,10],[17,15]],'#987fae');
      circle(0,2,22,'#8d76a9');polygon([[-14,-11],[-15,-28],[-3,-16]],'#8d76a9');polygon([[14,-11],[15,-28],[3,-16]],'#8d76a9');
    }else if(e.type==='SLIME'){
      ellipse(0,11,27,26,'#72bfa9');ellipse(-6,5,17,13,'#92e4c5');
    }else{
      ellipse(0,8,31,24,'#ae8593');circle(-19,-10,13,'#ae8593');circle(19,-10,13,'#ae8593');circle(-19,-10,7,'#e1a4b4');circle(19,-10,7,'#e1a4b4');
      line(23,20,42,23,'#f6bac1',3);
    }
    circle(-9,4,4,'#35263e');circle(10,4,4,'#35263e');ellipse(0,15,5,3,'#e5a6bd');
    fillRound(-29,-38,58,7,'#251922',4);fillRound(-27,-36,54*Math.max(0,e.hp/e.maxhp),3,'#f1a1ab',2);
    if(e.slowed>0)circle(30,-19,5,'#82d4ff');if(e.burn>0)circle(-28,-18,5,'#fd9c5f');C.restore();}
  function sky(){
    C.fillStyle=gradient(0,0,0,H,'#172739','#080e1e');C.fillRect(0,0,W,H);
    for(let i=0;i<46;i++){const x=((i*137+33)%730),y=(i*89+29)%1000;circle(x,y,1.2+Math.sin(i)*.7,'#a1bfc660');}
    C.fillStyle='#212a48';C.beginPath();C.moveTo(0,410);for(let x=0;x<=760;x+=36)C.lineTo(x,407+Math.sin(x*.027)*38);C.lineTo(760,880);C.lineTo(0,880);C.fill();
    C.fillStyle='#151f36';C.beginPath();C.moveTo(0,550);for(let x=0;x<=760;x+=35)C.lineTo(x,542+Math.sin(x*.035+2.3)*50);C.lineTo(760,900);C.lineTo(0,900);C.fill();
    for(let i=0;i<15;i++){const x=((i*95-state.seconds*55)%900+900)%900-60;line(x,845,x+45,855,'#a4b7b329',2);}
  }
  function header(){panel(22,18,676,205,'#1b293b','#536a7b',24);
    text('CAT',42,70,57,'#ffe0a3','900');text('TRAIN',160,70,57,'#eef1e7','900');
    text('КОТИ НА РЕЙКАХ • RAIL DEFENSE',44,111,17,'#a9bac8','700');
    fillRound(37,135,188,67,'#0b1727',15);text('♥ '+state.health+'/'+state.maxHealth,51,169,28,'#f5a0a3','900');
    fillRound(240,135,203,67,'#0b1727',15);text('🐟 '+state.fish,256,169,28,'#f6d58c','900');
    fillRound(456,135,225,67,'#0b1727',15);text('ХВИЛЯ '+state.wave+'/3',473,169,24,'#aed2d5','800');
  }
  function wagon(lane){const y=CAR_Y[lane];
    C.save();C.translate(0,y);
    fillRound(36,14,650,174,'#0c1525',27);fillRound(40,8,641,163,gradient(40,7,620,170,lane===0?'#34445b':'#2b4352','#172337'),24);
    strokeRound(40,8,641,163,'#7b8d9d',24,3);
    fillRound(54,18,614,43,'#121f32',13);
    for(let w=0;w<6;w++){fillRound(75+w*96,26,73,25,w%2?'#43647d':'#55718b',7);}
    fillRound(70,86,580,70,'#1d2f44',18);strokeRound(70,86,580,70,'#6f8c9c',18,2);
    line(90,155,624,155,'#abc7d75c',4);line(90,163,624,163,'#182836',4);
    for(let k=0;k<3;k++){const x=155+k*184;circle(x,169,22,'#0a1521');circle(x,169,13,'#6e889e');circle(x,169,7,'#192939');}
    text('0'+(lane+1),57,42,21,'#deeeea','900');text(['МАШИННЕ ВІДДІЛЕННЯ','ВАГОН МУТАЦІЙ','МЕДИЧНИЙ ВАГОН'][lane],109,43,16,'#d1e3e7','700');
    C.restore();
    // Enemies approach above the cat conveyor and stay in a separate visual lane.
    line(84,CAR_Y[lane]+77,648,CAR_Y[lane]+77,'#506680',3);
    for(let k=0;k<6;k++){
      const idx=lane*COLS+(lane===1?5-k:k),p=position(idx);
      if(k!==5)line(p.x+22,p.y,p.x+74,p.y,'#eac58b88',4);
      circle(p.x,p.y,42,state.cats[idx]?'#112334':'#101c2d');
      C.strokeStyle=state.cats[idx]?'#dfc481':'#496076';C.lineWidth=3;C.beginPath();C.arc(p.x,p.y,42,0,6.28);C.stroke();
      if(state.cats[idx])catFace(p.x,p.y+4,.88,state.cats[idx].type,state.cats[idx].tier,state.cats[idx].pulse);
      else{text('+',p.x,p.y,40,'#59798b','400','center');}
    }
    for(const e of state.enemies)if(e.lane===lane)drawEnemy(e);
  }
  function bottom(){panel(22,862,676,394,'#20283b','#53687a',24);
    text('НАСТУПНІ КОТИ',45,896,27,'#f6e5b6','900');
    text('ОБЕРИ КОТА → ТАПНИ МІСЦЕ НА ПОТЯЗІ',45,926,15,'#afc6d0','700');
    for(let i=0;i<3;i++){
      let r=R.queue[i],type=state.queue[i]||'FIRE',d=TYPES[type];
      fillRound(r.x+2,r.y+5,r.w,r.h,'#0a1424',17);
      fillRound(r.x,r.y,r.w,r.h,gradient(r.x,r.y,r.w,r.h,i===state.selected?'#3b5267':'#26364b','#121d30'),17);
      strokeRound(r.x,r.y,r.w,r.h,i===state.selected?'#ffda8b':'#526878',17,i===state.selected?5:2);
      catFace(r.x+103,r.y+67,.74,type,1,0);
      text(d.name,r.x+r.w/2,r.y+137,20,d.light,'900','center');
      if(i===state.selected){fillRound(r.x+61,r.y-8,83,24,'#f7ca80',8);text('ОБРАНО',r.x+102,r.y+4,13,'#423329','900','center');}
    }
    for(const [key,label,desc] of [['rush','↻  РУХ','2 🐟'],['reroll','НОВІ КОТИ','2 🐟'],['pause','II  ПАУЗА','']]){
      const r=R[key];fillRound(r.x,r.y,r.w,r.h,'#30455a',14);strokeRound(r.x,r.y,r.w,r.h,'#677d91',14,2);
      text(label,r.x+r.w/2,r.y+27,19,'#ecf2ed','800','center');text(desc,r.x+r.w/2,r.y+55,14,'#f1d294','700','center');
    }
  }
  function overlay(){
    if(state.phase==='play')return;
    C.fillStyle='#070b17dc';C.fillRect(0,0,W,H);
    if(state.phase==='intro'){
      fillRound(44,242,632,731,gradient(44,242,610,700,'#293d56','#121b2d'),30);strokeRound(44,242,632,731,'#8094a5',30,3);
      catFace(360,392,2,'FIRE',2,.1);
      text('CAT TRAIN',360,578,59,'#ffe4aa','900','center');
      text('Коти. Потяг. Дуже погані рішення.',360,630,24,'#e0eaf0','600','center');
      text('Вставляй котів у рухомий ланцюг.',360,694,22,'#bfd3dc','600','center');
      text('3 однакові поруч → один МУТАНТ.',360,728,22,'#ffe2a0','700','center');
      text('Захисти три вагони від монстрів!',360,762,21,'#bfd3dc','600','center');
      fillRound(R.intro.x,R.intro.y,R.intro.w,R.intro.h,'#f0c478',23);text('ПОЇХАЛИ!',360,934,35,'#302a31','900','center');
    }else if(state.phase==='station'){
      panel(28,318,664,689,'#223247','#87a0aa',28);
      text('СТАНЦІЯ '+state.wave,360,391,42,'#ffdd9a','900','center');
      text('Обери одне покращення перед',360,447,23,'#d9e6e8','600','center');
      text('наступною хвилею монстрів.',360,479,23,'#d9e6e8','600','center');
      text('ПРИБУТОК: '+state.score+' ОЧОК',360,547,22,'#b9d8d6','800','center');
      for(let i=0;i<3;i++){const r=R.upgrades[i],u=UPGRADES[i];fillRound(r.x,r.y,r.w,r.h,'#32485b',18);strokeRound(r.x,r.y,r.w,r.h,'#6e91a5',18,2);
        text(u.symbol,r.x+39,r.y+44,31,'#f5d590','800','center');text(u.name,r.x+78,r.y+30,22,'#fff0cf','900');text(u.desc,r.x+78,r.y+59,17,'#d4e1e3','500');}
    }else if(state.phase==='paused'){
      panel(76,400,568,500,'#233447','#8ba0ae',27);text('ПАУЗА',360,505,64,'#ffe2a9','900','center');
      text('Знайди місце для трьох котів',360,605,23,'#c9dce4','600','center');
      fillRound(134,783,452,85,'#f3c77e',22);text('ПРОДОВЖИТИ',360,826,32,'#302937','900','center');
    }else{
      panel(64,332,592,654,'#223247','#91a1ad',30);
      const win=state.phase==='win';
      text(win?'ПОТЯГ ВРЯТОВАНО!':'ПОТЯГ ЗАХОПИЛИ!',360,460,win?38:34,win?'#ffe3a4':'#ffaaa7','900','center');
      text(win?'Коти стали легендами залізниці.':'Монстри влаштували собі купе.',360,528,22,'#d2e4e5','600','center');
      catFace(360,655,1.55,win?'SPARK':'FROST',win?3:1,.1);
      text('ЗНИЩЕНО: '+state.kills+'    МУТАЦІЙ: '+state.merges,360,784,22,'#d3dee3','700','center');
      text('ОЧКИ: '+state.score,360,824,24,'#f4d18e','800','center');
      fillRound(110,890,500,85,'#f2c77d',22);text('ГРАТИ ЗНОВУ',360,931,29,'#302937','900','center');
    }
  }
  function draw(){
    C.save();C.clearRect(0,0,W,H);sky();
    if(state.shake>0){C.translate(rand(-2,2)*state.shake*4,rand(-2,2)*state.shake*4);}
    header();
    // Curved connectors: the cats travel along one serpentine conveyor across all wagons.
    C.strokeStyle='#ddc18d7a';C.lineWidth=7;C.beginPath();C.moveTo(592,LANES_Y[0]);C.bezierCurveTo(692,LANES_Y[0],692,LANES_Y[1],592,LANES_Y[1]);C.stroke();
    C.beginPath();C.moveTo(112,LANES_Y[1]);C.bezierCurveTo(20,LANES_Y[1],20,LANES_Y[2],112,LANES_Y[2]);C.stroke();
    for(let i=0;i<3;i++)wagon(i);
    // Decorative locomotive rail separators.
    for(let i=0;i<3;i++){const y=CAR_Y[i]+190;line(22,y,698,y,'#c2b99c29',2);}
    for(const p of state.particles){C.globalAlpha=clamp(p.life*2,0,1);circle(p.x,p.y,p.size,p.color);}C.globalAlpha=1;
    for(const s of state.shots){const alpha=clamp(s.life/s.ttl,0,1);C.globalAlpha=alpha;line(s.x,s.y,s.tx,s.ty,s.color,4);circle(s.tx,s.ty,7,s.color);}C.globalAlpha=1;
    for(const f of state.floaters){C.globalAlpha=clamp(f.life,0,1);text(f.label,f.x,f.y,21*f.scale,f.color,'900','center');}C.globalAlpha=1;
    const progress=clamp(state.spawned/state.need,0,1);fillRound(45,830,630,11,'#0a1a2b',6);fillRound(45,830,Math.max(1,630*progress),11,'#d4aa72',6);
    bottom();if(state.noticeT>0&&state.phase==='play'){
      fillRound(66,807,588,43,'#304457e7',12);text(state.notice,360,829,19,'#f5e6bd','700','center');}
    overlay();C.restore();
  }
  reset();draw();
  return {S:state,TYPES,position,step,draw,start,reset,insert,rotateCats,mergeAll,spawnEnemy,damageEnemy,upgrade,
    rush,reroll,getInfo,keyDown,pointerDown:(x,y)=>{state.lastDown={x,y};return input(x,y);},
    pointerUp:()=>{},pointerMove:()=>{}};
}
</script>
<script>(function(){
 const canvas=document.getElementById('game'),game=createCatTrain(canvas);
 const coords=e=>{const b=canvas.getBoundingClientRect();return{x:(e.clientX-b.left)*720/b.width,y:(e.clientY-b.top)*1280/b.height}};
 canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.setPointerCapture?.(e.pointerId);const p=coords(e);game.pointerDown(p.x,p.y);});
 canvas.addEventListener('pointerup',e=>{e.preventDefault();const p=coords(e);game.pointerUp(p.x,p.y);});
 document.addEventListener('keydown',e=>{if(['Space','ArrowDown','ArrowUp'].includes(e.code))e.preventDefault();game.keyDown(e.key)});
 let last=performance.now();function frame(now){const dt=Math.min(.1,(now-last)/1000);last=now;game.step(dt);requestAnimationFrame(frame)}
 window.__catTrain=game;requestAnimationFrame(frame);
})();</script></body></html>
